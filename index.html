    <script>
      // Apply saved preferences before first paint so the theme never flashes.
      (function () {
        try {
          var raw = localStorage.getItem("smartcart:prefs");
          if (!raw) return;
          var prefs = JSON.parse(raw);
          var root = document.documentElement;
          if (prefs.isDarkMode) root.classList.add("dark");
          if (prefs.rgb) root.dataset.rgb = prefs.rgb;
          if (prefs.reducedMotion) root.dataset.motion = "off";
        } catch (e) {
          /* first visit, or storage blocked — fall back to the HTML defaults */
        }
      })();
    </script>
